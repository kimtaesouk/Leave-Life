<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" href="mobile-shared.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" type="button" aria-label="메뉴 열기" onclick="MobileUI.toggleMenu()">☰</button>
                <h1>비밀번호 변경</h1>
            </div>
            <div class="user" id="mobileUser">관리자</div>
        </div>

        <div class="drawer-overlay" onclick="MobileUI.closeMenu()"></div>
        <aside class="drawer">
            <h3>메뉴</h3>
            <div class="menu">
                <button onclick="MobileUI.goMobile('mobile.html')">홈</button>
                <button onclick="MobileUI.goMobile('mobile-estimate.html')">견적서 관리</button>
                <button onclick="MobileUI.goMobile('mobile-funeralhall.html')">장례식장 관리</button>
                <button onclick="MobileUI.goMobile('mobile-cost.html')">비용 관리</button>
                <button onclick="MobileUI.goMobile('mobile-product.html')">상품 관리</button>
                <button id="adminCreateBtn" onclick="MobileUI.goMobile('mobile-admin-create.html')">관리자 추가</button>
                <button onclick="MobileUI.logout()">로그아웃</button>
            </div>
        </aside>

        <div class="container">
            <div class="card">
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">현재 비밀번호</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">새 비밀번호</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <div class="actions">
                        <button type="button" class="btn-outline" onclick="resetForm()">초기화</button>
                        <button type="submit" class="btn-primary">변경</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="mobile-shared.js"></script>
    <script>
        function resetForm() {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }
        document.addEventListener('DOMContentLoaded', function () {
            MobileUI.initAdmin();
        });
        document.getElementById('passwordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            if (!currentPassword || !newPassword || !confirmPassword) {
                alert('모든 비밀번호 입력란을 채워주세요.');
                return;
            }
            if (newPassword.length < 8) {
                alert('새 비밀번호는 8자 이상이어야 합니다.');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('새 비밀번호가 일치하지 않습니다.');
                return;
            }
            const formData = new FormData();
            formData.append('current_password', currentPassword);
            formData.append('new_password', newPassword);
            fetch('../api/update_admin_password.php', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('비밀번호가 변경되었습니다.');
                        resetForm();
                    } else {
                        alert(data.message || '비밀번호 변경에 실패했습니다.');
                    }
                })
                .catch(() => { alert('비밀번호 변경 중 오류가 발생했습니다.'); });
        });
        // init handled above
    </script>
</body>
</html>
