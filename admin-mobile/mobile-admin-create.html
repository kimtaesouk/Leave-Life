<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 추가</title>
    <link rel="stylesheet" href="mobile-shared.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" type="button" aria-label="메뉴 열기" onclick="MobileUI.toggleMenu()">☰</button>
                <h1>관리자 추가</h1>
            </div>
            <div class="user" id="mobileUser">관리자</div>
        </div>

        <div class="drawer-overlay" onclick="MobileUI.closeMenu()"></div>
        <aside class="drawer">
            <h3>메뉴</h3>
            <div class="menu">
                <button onclick="MobileUI.goMobile('mobile.html')">홈</button>
                <button onclick="MobileUI.goMobile('mobile-estimate.html')">견적서 관리</button>
                <button onclick="MobileUI.goMobile('mobile-funeralhall.html')">장례식장 관리</button>
                <button onclick="MobileUI.goMobile('mobile-cost.html')">비용 관리</button>
                <button onclick="MobileUI.goMobile('mobile-product.html')">상품 관리</button>
                <button onclick="MobileUI.goMobile('mobile-password.html')">비밀번호 변경</button>
                <button onclick="MobileUI.logout()">로그아웃</button>
            </div>
        </aside>

        <div class="container">
            <div class="card" id="adminCreateCard">
                <form id="adminCreateForm">
                    <div class="form-group">
                        <label for="adminCreateUserid">아이디</label>
                        <input type="text" id="adminCreateUserid" required>
                    </div>
                    <div class="form-group">
                        <label for="adminCreateName">이름</label>
                        <input type="text" id="adminCreateName" required>
                    </div>
                    <div class="form-group">
                        <label for="adminCreatePassword">비밀번호</label>
                        <input type="password" id="adminCreatePassword" required>
                    </div>
                    <div class="form-group">
                        <label for="adminCreatePasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="adminCreatePasswordConfirm" required>
                    </div>
                    <div class="form-group">
                        <label for="adminCreatePhone">전화번호</label>
                        <input type="text" id="adminCreatePhone">
                    </div>
                    <div class="form-group">
                        <label for="adminCreateRole">등급</label>
                        <select id="adminCreateRole">
                            <option value="2">관리자</option>
                            <option value="3">조회 전용</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button type="button" class="btn-outline" onclick="resetForm()">초기화</button>
                        <button type="submit" class="btn-primary">생성</button>
                    </div>
                </form>
            </div>
            <div class="card" id="noAccessCard" style="display:none;">
                <div class="notice">최고관리자만 접근할 수 있습니다.</div>
            </div>
        </div>
    </div>

    <script src="mobile-shared.js"></script>
    <script>
        function resetForm() { document.getElementById('adminCreateForm').reset(); }
        document.getElementById('adminCreateForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const userid = document.getElementById('adminCreateUserid').value.trim();
            const name = document.getElementById('adminCreateName').value.trim();
            const password = document.getElementById('adminCreatePassword').value;
            const passwordConfirm = document.getElementById('adminCreatePasswordConfirm').value;
            const phone = document.getElementById('adminCreatePhone').value.trim();
            const role = document.getElementById('adminCreateRole').value;
            if (!userid || !name || !password || !passwordConfirm) {
                alert('필수 항목을 모두 입력해주세요.');
                return;
            }
            if (password.length < 8) {
                alert('비밀번호는 8자 이상이어야 합니다.');
                return;
            }
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
            const formData = new FormData();
            formData.append('userid', userid);
            formData.append('name', name);
            formData.append('password', password);
            formData.append('phone', phone);
            formData.append('role', role);
            fetch('../api/create_admin_user.php', { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('관리자가 생성되었습니다.');
                        resetForm();
                    } else {
                        alert(data.message || '생성 중 오류가 발생했습니다.');
                    }
                })
                .catch(() => { alert('생성 중 오류가 발생했습니다.'); });
        });
        document.addEventListener('DOMContentLoaded', function () {
            MobileUI.initAdmin({ requireSuper: true });
        });
    </script>
</body>
</html>
