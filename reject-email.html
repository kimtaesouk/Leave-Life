<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일무단수집거부</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.7;
        }
        .page {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 32px 28px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            margin: 0 0 16px 0;
            font-size: 1.8rem;
            color: #4a90e2;
        }
        p {
            font-size: 0.98rem;
        }
        .notice {
            background: #f0f6ff;
            border-left: 4px solid #4a90e2;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>이메일무단수집거부</h1>
        <p>리브 라이프 홈페이지에 게시된 이메일 주소가 전자우편 수집 프로그램이나 그 밖의 기술적 장치를 이용하여 무단으로 수집되는 것을 거부합니다.</p>
        <div class="notice">
            위반 시 정보통신망 이용촉진 및 정보보호 등에 관한 법률에 의해 처벌될 수 있습니다.
        </div>
    </div>
</body>
</html>
