<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저작권정책</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.7;
        }
        .page {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 32px 28px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            margin: 0 0 16px 0;
            font-size: 1.8rem;
            color: #4a90e2;
        }
        h2 {
            margin: 24px 0 10px;
            font-size: 1.2rem;
            color: #333;
        }
        p, li {
            font-size: 0.98rem;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }

        ul li {
            position: relative;
            padding-left: 12px;
        }

        ul li::before {
            content: "·";
            position: absolute;
            left: 0;
            color: #8d6b3f;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>저작권정책</h1>
        <p>Leave Life 홈페이지에 게시된 모든 콘텐츠의 저작권은 회사 또는 정당한 권리자에게 있습니다.</p>

        <h2>1. 이용 범위</h2>
        <ul>
            <li>비영리 목적의 개인적 열람은 허용됩니다.</li>
            <li>사전 허락 없이 복제·배포·전송·출판을 금합니다.</li>
        </ul>

        <h2>2. 저작권 침해 시 조치</h2>
        <p>저작권 침해가 발생할 경우 관련 법령에 따른 민·형사상 책임이 발생할 수 있습니다.</p>

        <h2>3. 문의</h2>
        <p>저작권 관련 문의는 Leave Life 고객센터로 연락 바랍니다.</p>
    </div>
</body>
</html>
