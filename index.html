<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한우리 상조</title>
    <style>
        @font-face {
            font-family: 'Noto Sans KR';
            font-style: normal;
            font-weight: 300;
            font-display: swap;
            src: url('/fonts/NotoSansKR-1.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Noto Sans KR';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/NotoSansKR-2.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Noto Sans KR';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/fonts/NotoSansKR-3.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Noto Sans KR';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/NotoSansKR-4.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --bg: #f4f1ec;
            --text: #2b2621;
            --muted: #6b625a;
            --border: #ddd2c6;
            --surface: #ffffff;
            --surface-alt: #f0ebe4;
            --accent: #b38b5a;
            --accent-strong: #8d6b3f;
            --on-accent: #ffffff;
            --shadow: 0 8px 20px rgba(43, 38, 33, 0.12);
            --shadow-soft: 0 3px 10px rgba(43, 38, 33, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
        }

        a {
            color: inherit;
        }

        a:focus-visible,
        button:focus-visible,
        [role="button"]:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        /* 배너 영역 */
        .banner {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #2b2621 0%, #4a3b2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .banner img,
        .banner picture {
            width: 100%;
            height: 100%;
            display: block;
        }

        .banner img {
            object-fit: cover;
            object-position: center;
        }

        .banner-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2b2621 0%, #4a3b2a 100%);
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        /* 이미지 수정 모달 */
        .image-edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .image-edit-modal.show {
            display: flex;
        }

        .image-edit-content {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .image-edit-content h2 {
            margin-top: 0;
            color: var(--text);
        }

        .image-preview {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 20px 0;
            border: 2px dashed var(--border);
            border-radius: 5px;
            padding: 10px;
        }

        .image-edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .image-edit-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-edit-actions .save-btn {
            background-color: var(--accent);
            color: var(--on-accent);
        }

        .image-edit-actions .save-btn:hover {
            background-color: var(--accent-strong);
        }

        .image-edit-actions .cancel-btn {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .image-edit-actions .cancel-btn:hover {
            background-color: var(--surface-alt);
        }

         /* 삼선 메뉴 아이콘 */
         .menu-toggle {
            position: absolute;
            top: 20px;
            right: 30px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            padding: 0;
            appearance: none;
        }

        .menu-toggle span {
            display: block;
            width: 30px;
            height: 3px;
            background-color: var(--text);
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }

        .menu-toggle:hover span {
            background-color: var(--accent-strong);
        }

        /* 사이드 메뉴 */
        .side-menu {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background-color: var(--surface);
            box-shadow: -2px 0 16px rgba(0,0,0,0.12);
            transition: right 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
        }

        .side-menu.active {
            right: 0;
        }

        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        .side-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu-header {
            padding: 30px 20px;
            background: #2b2621;
            color: #ffffff;
            border-bottom: 1px solid var(--border);
        }

        .side-menu-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .side-menu-content {
            padding: 20px;
        }

        .side-menu-item {
            display: block;
            padding: 15px 20px;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .side-menu-item:hover {
            background-color: var(--surface-alt);
            color: var(--accent-strong);
            padding-left: 25px;
        }

        .side-menu-item:last-child {
            border-bottom: none;
        }

        /* 네비게이션 메뉴 */
        .navbar {
            background-color: var(--surface);
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        
        /* 사이드 메뉴가 열릴 때 네비게이션 바 비활성화 */
        body.side-menu-open .navbar {
            pointer-events: none;
            z-index: 99;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 0;
            width: 100%;
        }

        .nav-menu li {
            position: relative;
            flex: 1;
        }

        .nav-menu a {
            display: block;
            padding: 20px 0;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            text-align: center;
            font-size: 1.2rem;
        }

        .nav-menu a:hover {
            color: var(--accent-strong);
            background-color: var(--surface-alt);
            border-bottom-color: var(--accent-strong);
        }

        .nav-menu a.active {
            color: var(--accent-strong);
            border-bottom-color: var(--accent-strong);
        }

        /* 메인 콘텐츠 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .content-section {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border: 1px solid var(--border);
            min-height: 360px;
        }


        .content-section h1 {
            color: var(--text);
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .content-section h2 {
            color: #3a322b;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .content-section p {
            margin-bottom: 15px;
            line-height: 1.8;
            color: var(--muted);
        }

        .content-hero {
            margin: 18px 0 28px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
        }

        .content-hero img {
            width: 100%;
            height: auto;
            display: block;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 16px 0 24px;
        }

        .content-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        .content-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 1.05rem;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .content-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .content-card ul {
            margin: 10px 0 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.7;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .step-info-list {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .step-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface);
        }

        .step-info-title {
            font-weight: 600;
            color: var(--text);
        }

        .info-button {
            margin-left: auto;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid var(--accent);
            background-color: var(--surface-alt);
            color: var(--accent-strong);
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .step-details {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            border-left: 3px solid var(--accent);
            background-color: var(--surface-alt);
            border-radius: 6px;
            color: var(--muted);
            line-height: 1.7;
        }

        .step-details.show {
            display: block;
        }

        .soft-bullets {
            list-style: none;
            padding-left: 0;
        }

        .soft-bullets li {
            position: relative;
            padding-left: 12px;
        }

        .soft-bullets li::before {
            content: "·";
            position: absolute;
            left: 0;
            color: var(--accent-strong);
        }

        .home-hero {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .home-hero h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            color: var(--text);
        }

        .home-hero p {
            margin: 0 0 18px;
            color: var(--muted);
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .cta-primary {
            background-color: var(--accent);
            color: var(--on-accent);
            border-color: var(--accent);
        }

        .cta-secondary {
            background-color: var(--surface-alt);
            color: var(--text);
        }

        .home-note {
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .step-icon {
            width: 64px;
            height: 64px;
            display: block;
            margin: 4px auto 10px;
        }

        .content-figure {
            margin: 18px 0 24px;
            text-align: center;
        }

        .content-figure img {
            width: 100%;
            max-width: 720px;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
        }

        .content-figure figcaption {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* 푸터 */
        footer {
            background-color: #2b2621;
            color: #f5f2ee;
            text-align: left;
            padding: 20px 20px 28px;
            margin-top: 50px;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            font-size: 0.95rem;
            margin-bottom: 14px;
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-main {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: center;
            justify-content: space-between;
        }

        .footer-logos {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .footer-logos img {
            height: 44px;
            width: auto;
            object-fit: contain;
            background-color: transparent;
            padding: 0;
            border-radius: 4px;
        }

        .company-info {
            display: grid;
            gap: 6px;
            font-size: 0.9rem;
            color: #f0f0f0;
            line-height: 1.6;
        }

        .company-line {
            color: #f0f0f0;
        }

        .company-line[contenteditable="true"]:focus {
            outline: 1px dashed #cfcfcf;
            background-color: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 2px 4px;
        }

        .footer-copy {
            margin-top: 14px;
            color: #e0e0e0;
            font-size: 0.85rem;
        }


        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .nav-menu {
                flex-direction: row;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            
            .nav-menu::-webkit-scrollbar {
                display: none;
            }

            .nav-menu li {
                flex: 0 0 auto;
                min-width: fit-content;
            }

            .nav-menu a {
                padding: 15px 12px;
                font-size: 0.9rem;
                white-space: nowrap;
                border-bottom: 3px solid transparent;
            }

            .banner {
                height: 200px;
            }

            .banner-placeholder {
                font-size: 1.5rem;
            }
            
            .banner img {
                object-fit: cover;
                object-position: center;
            }

            .content-section {
                padding: 20px;
            }

            .menu-toggle {
                right: 16px;
            }

        }
    </style>
</head>

            </div>
            <div>
                <label for="imageFileInput">새 이미지 선택:</label>
                <input type="file" id="imageFileInput" accept="image/*" onchange="previewImage(this)" style="margin-top: 10px; width: 100%; padding: 10px; box-sizing: border-box;">
                <img id="newImagePreview" class="image-preview" src="" alt="새 이미지 미리보기" style="display: none; margin-top: 10px;">
            </div>
            <div class="image-edit-actions">
                <button class="save-btn" onclick="saveBannerImage(); return false;">저장</button>
                <button class="cancel-btn" onclick="closeImageEditModal(); return false;">취소</button>
            </div>
        </div>
    </div>

    <script>
        // 동적 콘텐츠 로딩 함수
        function loadContent(url) {
            const contentSection = document.querySelector('.content-section');
            
            // 현재 섹션을 localStorage에 저장
            localStorage.setItem('currentSection', url);
            
            // 로딩 표시
            contentSection.innerHTML = '<p>로딩 중...</p>';
            
            // AJAX로 파일 로드 (캐시 방지를 위해 타임스탬프 추가)
            fetch(url + '?t=' + Date.now(), {
                cache: 'no-cache'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('파일을 불러올 수 없습니다.');
                    }
                    return response.text();
                })
                .then(html => {
                    // 로드된 HTML 처리
                    let content = '';
                    
                    // 완전한 HTML 문서인지 확인 (DOCTYPE, html 태그 포함 여부)
                    if (html.trim().toLowerCase().includes('<!doctype') || html.trim().toLowerCase().includes('<html')) {
                        // 완전한 HTML 문서인 경우 body 내용 추출
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        content = doc.body ? doc.body.innerHTML : html;
                    } else {
                        // HTML 조각인 경우 그대로 사용
                        content = html;
                    }
                    
                    // 메인 콘텐츠 영역에 삽입
                    contentSection.innerHTML = content;
                    
                    // 삽입된 콘텐츠의 스크립트 실행을 위해 약간의 지연 후 실행
                    setTimeout(function() {
                        // 삽입된 스크립트 태그들을 찾아서 실행
                        const scripts = contentSection.querySelectorAll('script');
                        scripts.forEach(function(oldScript) {
                            const newScript = document.createElement('script');
                            Array.from(oldScript.attributes).forEach(function(attr) {
                                newScript.setAttribute(attr.name, attr.value);
                            });
                            newScript.textContent = oldScript.textContent;
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                    }, 100);
                    
                    // 네비게이션 메뉴 활성화 상태 업데이트
                    updateActiveMenu(url);
                })
                .catch(error => {
                    contentSection.innerHTML = '<p>오류: ' + error.message + '</p>';
                    console.error('Error loading content:', error);
                });
        }


        // 배너 이미지 수정 모달 열기
        function editBannerImage() {
            const modal = document.getElementById('imageEditModal');
            if (modal) {
                modal.classList.add('show');
                // 현재 이미지 경로 가져오기
                const bannerImg = document.querySelector('.banner picture img, .banner img');
                if (bannerImg) {
                    document.getElementById('currentImagePreview').src = bannerImg.src;
                }
            }
        }

        // 이미지 수정 모달 닫기
        function closeImageEditModal() {
            const modal = document.getElementById('imageEditModal');
            if (modal) {
                modal.classList.remove('show');
                document.getElementById('imageFileInput').value = '';
                document.getElementById('newImagePreview').src = '';
                document.getElementById('newImagePreview').style.display = 'none';
            }
        }

        // 이미지 파일 선택 시 미리보기
        function previewImage(input) {
            const preview = document.getElementById('newImagePreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 이미지 저장
        function saveBannerImage() {
            const fileInput = document.getElementById('imageFileInput');
            if (!fileInput.files || !fileInput.files[0]) {
                alert('이미지 파일을 선택해주세요.');
                return;
            }

            const formData = new FormData();
            formData.append('banner_image', fileInput.files[0]);

            // 저장 버튼 비활성화
            const saveBtn = document.querySelector('.save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '저장 중...';

            fetch('api/upload_banner.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('이미지가 변경되었습니다.');
                    
                    // 타임스탬프 생성 (캐시 방지)
                    const timestamp = data.timestamp || Date.now();
                    
                    // 업로드된 파일명 추출 (예: banner_1920x600.png)
                    const uploadedFileName = data.file_path.split('/').pop(); // 'banner_1920x600.png'
                    const baseFileName = uploadedFileName.split('.')[0]; // 'banner_1920x600'
                    
                    console.log('업로드된 파일:', uploadedFileName);
                    console.log('기본 파일명:', baseFileName);
                    
                    // localStorage에 이미지 경로 저장 (새로고침 후에도 유지)
                    localStorage.setItem('banner_image_path', data.file_path);
                    localStorage.setItem('banner_image_timestamp', timestamp.toString());
                    
                    // 배너 이미지 강제 새로고침 (캐시 방지)
                    const bannerImg = document.querySelector('.banner picture img, .banner img');
                    if (bannerImg) {
                        // 현재 이미지 경로 확인
                        const currentSrc = bannerImg.src || bannerImg.getAttribute('src');
                        console.log('현재 이미지 경로:', currentSrc);
                        
                        // 새 경로로 업데이트 (타임스탬프 포함)
                        const newSrc = data.file_path + '?t=' + timestamp;
                        bannerImg.src = newSrc;
                        bannerImg.setAttribute('src', newSrc);
                        console.log('이미지 src 업데이트:', newSrc);
                        
                        // 이미지 강제 재로드
                        bannerImg.style.display = 'none';
                        setTimeout(() => {
                            bannerImg.style.display = 'block';
                            bannerImg.src = newSrc + '&_=' + Date.now(); // 추가 캐시 방지
                        }, 10);
                    }
                    
                    // picture 태그 내부의 모든 source 태그 업데이트
                    const sources = document.querySelectorAll('.banner picture source');
                    sources.forEach(source => {
                        const oldSrcset = source.getAttribute('srcset');
                        if (oldSrcset) {
                            // 기존 경로에서 파일명 추출
                            const oldPath = oldSrcset.split('?')[0];
                            const oldFileName = oldPath.split('/').pop();
                            
                            // 같은 기본 파일명이면 업데이트
                            if (oldFileName && oldFileName.includes(baseFileName)) {
                                const newSrcset = data.file_path + '?t=' + timestamp;
                                source.setAttribute('srcset', newSrcset);
                                console.log('Source srcset 업데이트:', newSrcset);
                            } else {
                                // 다른 파일명이어도 타임스탬프 추가하여 캐시 방지
                                const newSrcset = oldPath + '?t=' + timestamp;
                                source.setAttribute('srcset', newSrcset);
                                console.log('Source srcset 타임스탬프 추가:', newSrcset);
                            }
                        }
                    });
                    
                    // 모달 닫기
                    closeImageEditModal();
                } else {
                    alert(data.message || '이미지 업로드에 실패했습니다.');
                    if (data.debug) {
                        console.error('Upload debug:', data.debug);
                    }
                    saveBtn.disabled = false;
                    saveBtn.textContent = '저장';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('이미지 업로드 중 오류가 발생했습니다.');
                saveBtn.disabled = false;
                saveBtn.textContent = '저장';
            });
        }

        // 네비게이션 메뉴 활성화 상태 업데이트
        function updateActiveMenu(url) {
            const navLinks = document.querySelectorAll('.nav-menu a');
            navLinks.forEach(link => {
                link.classList.remove('active');
            });
            
            // URL에 따라 해당 메뉴 활성화
            const menuMap = {
                'home/home.html': 0,
                'estimate/estimate.html': 1,
                'guide/guide.html': 2,
                'support/support.html': 3
            };
            
            const menuIndex = menuMap[url];
            if (menuIndex !== undefined) {
                const menuItems = document.querySelectorAll('.nav-menu li');
                if (menuItems[menuIndex]) {
                    const menuLink = menuItems[menuIndex].querySelector('a');
                    if (menuLink) {
                        menuLink.classList.add('active');
                    }
                }
            }
        }
        
        // 사이드 메뉴 열기/닫기 함수
        function toggleSideMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const sideMenuOverlay = document.getElementById('sideMenuOverlay');
            const menuToggle = document.getElementById('menuToggle');
            const body = document.body;
            
            sideMenu.classList.toggle('active');
            sideMenuOverlay.classList.toggle('active');
            menuToggle.classList.toggle('active');
            
            // body에 클래스 추가/제거하여 네비게이션 바 비활성화
            if (sideMenu.classList.contains('active')) {
                body.classList.add('side-menu-open');
            } else {
                body.classList.remove('side-menu-open');
            }
        }

        function closeSideMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const sideMenuOverlay = document.getElementById('sideMenuOverlay');
            const menuToggle = document.getElementById('menuToggle');
            const body = document.body;
            
            sideMenu.classList.remove('active');
            sideMenuOverlay.classList.remove('active');
            menuToggle.classList.remove('active');
            body.classList.remove('side-menu-open');
        }

        // 페이지 로드 시 초기 콘텐츠 로드
        // 배너 이미지 경로 로드 (localStorage에서)
        function loadBannerImage() {
            const savedBannerPath = localStorage.getItem('banner_image_path');
            if (savedBannerPath) {
                const bannerImg = document.querySelector('.banner picture img, .banner img');
                if (bannerImg) {
                    // 타임스탬프 추가하여 캐시 방지
                    const timestamp = localStorage.getItem('banner_image_timestamp') || Date.now();
                    const newSrc = savedBannerPath + '?t=' + timestamp;
                    bannerImg.src = newSrc;
                    bannerImg.setAttribute('src', newSrc);
                    
                    // picture 태그 내부의 source도 업데이트
                    const sources = document.querySelectorAll('.banner picture source');
                    sources.forEach(source => {
                        const oldSrcset = source.getAttribute('srcset');
                        if (oldSrcset && oldSrcset.includes('banner_1920x600')) {
                            source.setAttribute('srcset', savedBannerPath + '?t=' + timestamp);
                        }
                    });
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 배너 이미지 경로 로드 (localStorage에서)
            loadBannerImage();
            
            // 저장된 섹션이 있으면 복원, 없으면 기본값(about.html) 로드
            const savedSection = localStorage.getItem('currentSection');
            const initialUrl = savedSection || 'home/home.html';
            
            // 초기 화면 로드
            loadContent(initialUrl);

            

            // 햄버거 메뉴 클릭 이벤트
            const menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleSideMenu();
                });
            }
            
            // 오버레이 클릭 시 메뉴 닫기
            const sideMenuOverlay = document.getElementById('sideMenuOverlay');
            if (sideMenuOverlay) {
                sideMenuOverlay.addEventListener('click', function() {
                    closeSideMenu();
                });
            }
            
            // ESC 키로 메뉴 닫기
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeSideMenu();
                }
            });
        });
    </script>
</body>
</html>
