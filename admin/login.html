<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리브라이프 관리자 | 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans KR", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1d2b25;
            background:
                radial-gradient(circle at 82% 12%, rgba(65, 115, 92, .18), transparent 32%),
                linear-gradient(145deg, #eef3f0 0%, #f8faf9 56%, #e6eeea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            position: relative;
            overflow: hidden;
            background-color: rgba(255,255,255,.96);
            padding: 42px;
            border: 1px solid #dbe4df;
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(26, 58, 44, .13);
            width: 100%;
            max-width: 430px;
        }

        .login-container::before {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            content: "";
            background: #1d5943;
        }

        .admin-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .admin-brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            color: #fff;
            background: #174a37;
            border-radius: 10px;
        }

        .admin-brand-mark svg { width: 22px; height: 22px; }
        .admin-brand strong,
        .admin-brand span { display: block; }
        .admin-brand strong { color: #173f31; font-size: 1.03rem; letter-spacing: -.02em; }
        .admin-brand span { margin-top: 2px; color: #7a8781; font-size: .75rem; }

        .login-container h1 {
            color: #18271f;
            margin-bottom: 8px;
            font-size: 1.65rem;
            letter-spacing: -.04em;
        }

        .login-description { margin: 0 0 28px; color: #77847e; font-size: .86rem; }

        .login-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cad5d0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #2b674f;
            box-shadow: 0 0 0 3px rgba(43, 103, 79, .1);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 8px;
            width: auto;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1e5b44;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: .98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            background: #174735;
            box-shadow: 0 8px 18px rgba(25, 79, 58, .22);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="admin-brand">
            <span class="admin-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21V9"/><path d="M12 13C7 13 4 10 4 5c5 0 8 3 8 8Z"/><path d="M12 17c5 0 8-3 8-8-5 0-8 3-8 8Z"/></svg></span>
            <span><strong>리브라이프 관리자</strong><span>장례 서비스 운영센터</span></span>
        </div>
        <h1>관리자 로그인</h1>
        <p class="login-description">운영 계정으로 로그인해 견적과 서비스 데이터를 관리하세요.</p>
        <div class="error-message" id="errorMessage"></div>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> 로그인 상태 유지
                </label>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">로그인</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.querySelector('input[name="remember"]').checked;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            // 에러 메시지 숨김
            errorMessage.classList.remove('show');
            
            // 입력값 검증
            if (!username) {
                showError('아이디를 입력해주세요.');
                return;
            }
            
            if (!password) {
                showError('비밀번호를 입력해주세요.');
                return;
            }
            
            // 로그인 버튼 비활성화
            loginBtn.disabled = true;
            loginBtn.textContent = '로그인 중...';
            
            // 폼 데이터 준비
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('remember', remember ? '1' : '0');
            
            // 서버로 전송
            fetch('../api/admin_login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 로그인 성공 시 관리자 페이지로 이동
                    window.location.href = 'index.html';
                } else {
                    showError(data.message || '로그인에 실패했습니다.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '로그인';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('로그인 처리 중 오류가 발생했습니다.');
                loginBtn.disabled = false;
                loginBtn.textContent = '로그인';
            });
        });
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
    </script>
</body>
</html>
